name: tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  oldest-supported:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Build the bundled demo index
        run: python -m collocagent build-demo
      - name: Unit tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Smoke evaluation
        run: PYTHONPATH=. python scripts/evaluate_smoke.py
      - name: Command-line interface
        run: python -m collocagent analyze "The researchers make an experiment." --pretty

  newest-supported:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build the bundled demo index
        run: python -m collocagent build-demo
      - name: Unit tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Smoke evaluation
        run: PYTHONPATH=. python scripts/evaluate_smoke.py
      - name: Command-line interface
        run: python -m collocagent analyze "The researchers make an experiment." --pretty
