[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "collocagent"
version = "0.1.0"
description = "Standalone, auditable corpus-grounded collocation feedback"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Mohammed Abdessamed Nour", email = "ma.nour@cu-elbayadh.dz"}]
keywords = ["NLP", "collocations", "academic writing", "corpus linguistics"]

[project.scripts]
collocagent = "collocagent.cli:main"

[tool.setuptools.packages.find]
include = ["collocagent*"]
